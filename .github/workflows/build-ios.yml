name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build for iPhone
        run: |
          xcodebuild -version
          xcodebuild -project TDSCarKit.xcodeproj -scheme TDSCarKit \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" CODE_SIGNING_ALLOWED=NO build

      - name: Test projection protocol
        run: |
          swift test --filter AccessoryMessagesTests
          python3 Tools/verify_legacy62.py
          bash Tools/test_zeeho_control.sh
          bash Tools/test_zeeho_seplus.sh
          bash Tools/test_tailing.sh

      - name: Package unsigned IPA
        run: |
          app="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/TDSCarKit.app"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")
          lipo "$app/$executable" -verify_arch arm64
          mkdir -p "$RUNNER_TEMP/package/Payload"
          ditto "$app" "$RUNNER_TEMP/package/Payload/TDSCarKit.app"
          cd "$RUNNER_TEMP/package"
          zip -q -r -y "$RUNNER_TEMP/CarWithin-unsigned.ipa" Payload
          unzip -tq "$RUNNER_TEMP/CarWithin-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CarWithin-iOS-unsigned
          path: ${{ runner.temp }}/CarWithin-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
